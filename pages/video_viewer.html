<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Video Viewer</title>
    <link rel="stylesheet" href="../assets/video_viewer.css">
</head>

<body>
    <div id="topRevealZone" class="top-reveal-zone" aria-hidden="true"></div>
    <!-- Mobile-only floating nav arrows (hidden on desktop via CSS) -->
    <button id="mobilePrevBtn" class="mobile-nav-arrow mobile-nav-prev" disabled
        aria-label="Previous video">&#8249;</button>
    <button id="mobileNextBtn" class="mobile-nav-arrow mobile-nav-next" disabled
        aria-label="Next video">&#8250;</button>

    <div class="header">
        <div class="header-left">
            <div class="title">🎬 Video Viewer</div>
            <div id="subtitle" class="subtitle" aria-live="polite">Open a folder containing mp4 files</div>
        </div>
        <div class="controls">
            <div id="folderBadge" class="book-badge" style="display:none;"></div>

            <div class="nav-controls">
                <button id="prevBtn" class="nav-btn" disabled>← Previous</button>
                <div id="pageInfo" class="page-info" aria-live="polite">-</div>
                <button id="nextBtn" class="nav-btn" disabled>Next →</button>
            </div>

            <div class="zoom-controls">
                <button id="zoomOut" class="zoom-btn">−</button>
                <button id="zoomIn" class="zoom-btn">+</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="viewer-container" id="zoomContainer">
            <div id="welcomeMessage" class="welcome-message">
                <div class="welcome-icon">🎬</div>
                <div class="welcome-text">
                    Open a folder with <span class="welcome-code">?folder=path/to/videos</span>.<br>
                    Playback starts immediately. The part list and upcoming video are fetched in the background.
                </div>
            </div>
            <div id="loadingMessage" class="loading" hidden>
                Loading video…
            </div>
            <div id="videoContainer" class="video-container" hidden>
                <video id="videoPlayer1" class="video-player" playsinline preload="none"></video>
                <video id="videoPlayer2" class="video-player is-idle" playsinline preload="none"></video>

                <div id="bufferingOverlay" class="buffering-overlay" hidden>
                    <span class="buffering-spinner" aria-hidden="true"></span>
                    <span>Buffering</span>
                </div>
                <p id="playerStatus" class="player-status" hidden></p>

                <div class="custom-controls" id="customControls">
                    <div class="progress-bar-container" id="progressContainer">
                        <div class="progress-bar-bg"></div>
                        <div class="progress-bar-buffer" id="bufferFill"></div>
                        <div class="progress-bar-fill" id="progressFill"></div>
                        <div class="progress-bar-handle" id="progressHandle"></div>
                    </div>
                    <div class="controls-row">
                        <button class="control-btn" id="playPauseBtn" type="button" title="Play/Pause (Space)">▶</button>
                        <button class="control-btn skip-btn" id="skipBackBtn" type="button" title="Rewind 10s (←)">⟲10</button>
                        <button class="control-btn skip-btn" id="skipFwdBtn" type="button" title="Forward 10s (→)">10⟳</button>
                        <button class="control-btn" id="muteBtn" type="button" title="Mute (M)">🔊</button>
                        <input id="volumeSlider" class="volume-slider" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
                        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                        <div class="controls-spacer"></div>
                        <button class="control-btn speed-btn" id="speedBtn" type="button" title="Playback speed">1×</button>
                        <button class="control-btn" id="fullscreenBtn" type="button" title="Fullscreen (F)">⛶</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/video_viewer.js"></script>
</body>

</html>
