<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>India Today Group</title>

    <link rel="stylesheet" href="../assets/index.css">
    <link rel="stylesheet" href="../assets/login.css" />
    <script src="../assets/login.js"></script>
    <style>
        .year-title {
            margin: 28px 0 8px;
            font-size: 1.35rem;
            letter-spacing: -0.03em;
        }

        .month-title {
            margin: 16px 0 10px;
            color: var(--muted);
            font-size: 1.05rem;
            font-weight: 600;
        }

        .hub-back {
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .hub-back a {
            color: var(--muted);
            text-decoration: none;
        }

        .hub-back a:hover {
            color: var(--text);
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <main class="shell">

        <section class="hero">
            <div>
                <h1>India Today Group</h1>
                
            </div>

            <div id="count" class="count"></div>
        </section>

        <section class="section">
            <div class="section-head">
                <h2 class="section-title">Magazines</h2>
                <div class="section-note">573 Issues</div>
            </div>

            <section class="grid" id="hubGrid">
                <a class="card" href="business_today_index.html">
                    <h2 class="card-title">Business Today</h2>
                    <p style="margin-top:8px;color:var(--muted);font-size:0.92rem;">Fortnightly business magazine — 112 issues.</p>
                </a>
                <a class="card" href="india_today_index.html">
                    <h2 class="card-title">India Today</h2>
                    <p style="margin-top:8px;color:var(--muted);font-size:0.92rem;">Weekly news magazine — 419 issues.</p>
                </a>
                <a class="card" href="auto_today_index.html">
                    <h2 class="card-title">Auto Today</h2>
                    <p style="margin-top:8px;color:var(--muted);font-size:0.92rem;">Automotive magazine — 42 issues.</p>
                </a>
            </section>

        </section>

        <div class="empty" style="display:none;">
            No book folders were found.
        </div>

        <div class="footer">
            Click any issue to open it in the dual-page viewer.
        </div>

    </main>

    <script src="../assets/india_today_group_hub.js"></script>

</body>

</html>
